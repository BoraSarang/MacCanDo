name: E2E

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 시스템 Chrome 설치 (channel: chrome 사용 — 브라우저 다운로드 회피)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 의존성 설치
        working-directory: web
        run: npm ci

      - name: E2E 스모크 테스트 (홈/상세/검색/카테고리)
        working-directory: web
        env:
          CI: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx playwright test
