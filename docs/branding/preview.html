<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MacCanDo 로고 비교 — A/B</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; padding: 40px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .grid { display: flex; gap: 32px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 16px; padding: 24px; width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card p { font-size: 13px; color: #6e6e73; margin: 0 0 16px; }
  .card img { width: 100%; border-radius: 12px; }
</style>
</head>
<body>
<h1>MacCanDo 로고 — A/B 비교</h1>
<div class="grid">
  <div class="card">
    <h2>A. 그라디언트 헥사곤 "MC"</h2>
    <p>블루→퍼플 6각형 + MC 모노그램 — 파비콘 축소에도 선명</p>
    <img src="logo_A_hexagon.png" alt="A안 헥사곤 MC">
  </div>
  <div class="card">
    <h2>B. 체크 배지</h2>
    <p>라운드 스퀘어 + 굵은 체크 — "Mac Can Do(해냄)" 직관 전달, 앱 아이콘 친화적</p>
    <img src="logo_B_check.png" alt="B안 체크 배지">
  </div>
</div>
</body>
</html>
